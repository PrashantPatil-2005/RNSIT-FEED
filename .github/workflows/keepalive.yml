# Keeps the free Supabase project awake: free projects pause after about 7 days without activity.
# Uses only the public anon key (already shipped to every browser) to read the public departments
# list, so nothing sensitive is stored in this public repository. Logs show the HTTP status only.
#
# Secrets in the "production" environment (Settings > Environments > production):
#   SUPABASE_URL       https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  the project's anon / publishable key
#
# Backups and account-deletion clean-up run from the private ops repository, not here.
name: keepalive

on:
  schedule:
    - cron: "15 3 * * *" # 08:45 IST daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    steps:
      - name: Read one public row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Strip whitespace, newlines and quotes that often sneak in when pasting secrets.
          url=$(printf '%s' "$SUPABASE_URL" | tr -d " \t\r\n\"'")
          key=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d " \t\r\n\"'")
          url="${url%/}"
          [ -n "$url" ] || { echo "::error::Secret SUPABASE_URL is missing or empty"; exit 1; }
          [ -n "$key" ] || { echo "::error::Secret SUPABASE_ANON_KEY is missing or empty"; exit 1; }
          case "$url" in https://*.supabase.co) ;; *) echo "::error::SUPABASE_URL must look like https://<ref>.supabase.co (length ${#url})"; exit 1 ;; esac
          case "$key" in
            sb_publishable_*) echo "key type: publishable" ;;
            eyJ*) echo "key type: legacy anon JWT" ;;
            sb_secret_*) echo "::error::SUPABASE_ANON_KEY is a SECRET key. Use the anon/publishable key instead."; exit 1 ;;
            *) echo "::warning::key type unrecognised (expected sb_publishable_ or eyJ), length ${#key}" ;;
          esac
          # Only the apikey header: it works for both key types, while a publishable key sent as a
          # Bearer token is rejected.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 \
            "$url/rest/v1/departments?select=id&limit=1" -H "apikey: $key")
          echo "::notice::keep-alive HTTP status $code"
          [ "$code" = "200" ] || { echo "::error::HTTP $code (401 = key wrong for this project, 404 = wrong URL)"; exit 1; }
